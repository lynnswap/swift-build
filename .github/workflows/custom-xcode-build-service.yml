name: Custom Xcode build service

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Utilities/CustomXcodeBuildService/**'
      - '.github/actionlint.yaml'
      - '.github/workflows/custom-xcode-build-service*.yml'
  workflow_call:
    inputs:
      revision:
        description: Approved commit to build and test
        required: true
        type: string
      version:
        description: Approved release version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version, such as v0.1.0-beta.1 (does not publish a release)'
        required: true
        default: v0.0.0-validation
        type: string

permissions:
  contents: read

concurrency:
  group: custom-xcode-build-service-${{ inputs.revision || github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build service and test selection CLI
    # Build once, then exercise this same artifact with each client Xcode.
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      xcodes: ${{ steps.xcodes.outputs.xcodes }}
      artifact_id: ${{ steps.binary.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.0.0-validation' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Discover Xcodes on the preview runner
        id: xcodes
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/xcode_matrix.py discover \
            --runner xcode-27 --github-output "$GITHUB_OUTPUT"
      - name: Check distribution scripts
        run: |
          python3 -m unittest discover -s Utilities/CustomXcodeBuildService/Distribution/tests -p 'test_*.py'
      - name: Build committed service and management CLI
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/release.py build \
            --version "$RELEASE_VERSION" --output-dir "$RUNNER_TEMP/custom-service-build" --jobs 2
      - name: Test management CLI
        working-directory: Utilities/CustomXcodeBuildService
        run: xcodebuild test -scheme CustomXcodeBuildService -testPlan CustomXcodeBuildService -destination 'platform=macOS,arch=arm64'
      - name: Package binaries, resources, and licenses
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/release.py package \
            --build-dir "$RUNNER_TEMP/custom-service-build" --output-dir "$RUNNER_TEMP/custom-service-release"
      - id: binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: custom-xcode-build-service-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/custom-service-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  discover-xcodes:
    name: Discover Xcodes on the stable runner
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      xcodes: ${{ steps.xcodes.outputs.xcodes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Discover installed Xcodes
        id: xcodes
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/xcode_matrix.py discover \
            --runner macos-26 --github-output "$GITHUB_OUTPUT"

  compatibility-matrix:
    name: Select stable Xcodes and the latest beta
    needs: [build, discover-xcodes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Select compatibility targets
        id: select
        env:
          STABLE_RUNNER_XCODES: ${{ needs.discover-xcodes.outputs.xcodes }}
          PREVIEW_RUNNER_XCODES: ${{ needs.build.outputs.xcodes }}
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/xcode_matrix.py plan \
            --inventories "$STABLE_RUNNER_XCODES" "$PREVIEW_RUNNER_XCODES" \
            --github-output "$GITHUB_OUTPUT"

  compatibility:
    name: IPC compatibility (Xcode ${{ matrix.version }}, ${{ matrix.build }})
    needs: [build, compatibility-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/custom-service-release
      - name: Test Xcode IPC and SwiftPM compatibility
        run: |
          sw_vers
          xcrun xcodebuild -version
          python3 Utilities/CustomXcodeBuildService/Distribution/release.py verify \
            --release-dir "$RUNNER_TEMP/custom-service-release"

  homebrew:
    # Stable release source/bottle builds belong to the tap; PRs and prereleases
    # still exercise the recipe in an isolated tap.
    if: github.event_name != 'workflow_dispatch' || inputs.revision == '' || contains(inputs.version, '-')
    name: Test source Formula and installed bottle
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version || 'v0.0.0-validation' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}
      - name: Prepare the checked-out source for isolated Formula verification
        run: |
          git archive --format=tar.gz --prefix=source/ HEAD --output="$RUNNER_TEMP/source.tar.gz"
          python3 Utilities/CustomXcodeBuildService/Distribution/release.py source \
            --version "$RELEASE_VERSION" --source-archive "$RUNNER_TEMP/source.tar.gz" \
            --output-dir "$RUNNER_TEMP/homebrew-verification"
      - name: Build, bottle, reinstall, and test
        run: bash Utilities/CustomXcodeBuildService/Distribution/test-homebrew.sh "$RUNNER_TEMP/homebrew-verification"

  checks:
    name: Required distribution checks
    needs: [build, compatibility, homebrew]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$BUILD_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          if [[ -n "$REVISION" && "$VERSION" != *-* ]]; then
            test "$HOMEBREW_RESULT" = skipped
          else
            test "$HOMEBREW_RESULT" = success
          fi
