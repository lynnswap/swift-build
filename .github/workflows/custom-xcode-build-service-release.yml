name: Custom Xcode build service release

run-name: Release draft ${{ inputs.release_id }} at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft ID supplied by Utilities/CustomXcodeBuildService/Distribution/publish_release.py start
        required: true
        type: string
      target_sha:
        description: Approved full commit SHA
        required: true
        type: string
      content_digest:
        description: Approved draft fingerprint supplied by Utilities/CustomXcodeBuildService/Distribution/publish_release.py start
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check approved draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub requires push access to read unpublished drafts.
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
      prerelease: ${{ steps.draft.outputs.prerelease }}
      release_url: ${{ steps.draft.outputs.release_url }}
    steps:
      - name: Require default branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$WORKFLOW_REF" = "refs/heads/$RELEASE_BRANCH"

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify approved draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/publish_release.py verify \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --github-output "$GITHUB_OUTPUT"

  package-tests:
    name: Build and verify binary release
    needs: prepare
    uses: ./.github/workflows/custom-xcode-build-service.yml
    with:
      revision: ${{ inputs.target_sha }}
      version: ${{ needs.prepare.outputs.version }}

  publication-summary:
    name: Review verified release outputs
    needs: [prepare, package-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize the tested release before publication approval
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CHECKSUMS_SHA256: ${{ needs.package-tests.outputs.checksums_sha256 }}
          ARTIFACT_ID: ${{ needs.package-tests.outputs.artifact_id }}
        run: |
          {
            echo '## Verified binary release awaiting approval'
            echo
            printf 'Version: <code>%s</code>\n\n' "$VERSION"
            printf 'Source commit: <code>%s</code>\n\n' "$TARGET_SHA"
            printf 'Approved content digest: <code>%s</code>\n\n' "$CONTENT_DIGEST"
            printf 'Checksums file SHA-256: <code>%s</code>\n\n' "$CHECKSUMS_SHA256"
            printf '[Review draft title and notes](%s)\n\n' "$RELEASE_URL"
            printf '[Review code receiving the private key](https://github.com/%s/blob/%s/.github/workflows/custom-xcode-build-service-release.yml)\n\n' "$GITHUB_REPOSITORY" "$WORKFLOW_SHA"
            printf '[Tested release assets](https://github.com/%s/actions/runs/%s/artifacts/%s)\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_ID"
            echo 'The same archive passed Xcode compatibility and Homebrew/mise installation checks. Approval publishes these bytes. Stable publication then starts a separate tap update.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified binary release
    needs: [prepare, package-tests, publication-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download the tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package-tests.outputs.artifact_id }}
          path: release
          digest-mismatch: error
      - name: Revalidate approved content before using the App key
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUMS_SHA256: ${{ needs.package-tests.outputs.checksums_sha256 }}
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/publish_release.py verify \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST"
          python3 Utilities/CustomXcodeBuildService/Distribution/publish_release.py verify-assets \
            --version "$VERSION" --release-dir release --checksums-sha256 "$CHECKSUMS_SHA256"
      - name: Create a token scoped to source publication
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_RELEASE_APP_PRIVATE_KEY }}
          owner: lynnswap
          repositories: swift-build
          permission-contents: write
          permission-workflows: write
      - name: Publish the approved tested artifact
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTENT_DIGEST: ${{ inputs.content_digest }}
          CHECKSUMS_SHA256: ${{ needs.package-tests.outputs.checksums_sha256 }}
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/publish_release.py publish \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --target "$TARGET_SHA" --digest "$CONTENT_DIGEST" \
            --release-dir release --checksums-sha256 "$CHECKSUMS_SHA256"

  dispatch-tap:
    name: Start stable tap update
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-publish
    steps:
      - name: Checkout trusted notification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Create a token scoped to tap workflow dispatch
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_DISPATCH_APP_PRIVATE_KEY }}
          owner: lynnswap
          repositories: homebrew-tap
          permission-actions: write
      - name: Propose the published binary Formula
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 Utilities/CustomXcodeBuildService/Distribution/publish_release.py dispatch-tap \
            --source-repository "$GITHUB_REPOSITORY" --version "$VERSION"
