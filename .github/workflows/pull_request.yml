name: Fork PR validation

on:
  pull_request:
    branches: [validation/upstream-main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: fork-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Format and merge contents
    if: github.repository == 'lynnswap/swift-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the tested merge contains the submitted code
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse HEAD
          git diff --exit-code "$PR_HEAD_SHA" HEAD -- . ':!.github/workflows/pull_request.yml'
      - name: Check formatting
        run: bash .github/scripts/format-check.sh

  macos:
    name: macOS full suite (Xcode 27)
    if: github.repository == 'lynnswap/swift-build'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run full test suite
        run: swift test --disable-sandbox --jobs 3

  macos-tsan:
    name: macOS coordinator TSan (100 repetitions)
    if: github.repository == 'lynnswap/swift-build'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run coordinator tests with Thread Sanitizer
        run: >-
          swift test --disable-sandbox --jobs 3
          --sanitize thread
          --filter DependencyGraphRequestCoordinatorTests
          --maximum-repetitions 100 --repeat-until fail

  linux:
    name: Linux full suite (Swift 6.4 nightly)
    if: github.repository == 'lynnswap/swift-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swiftlang/swift:nightly-6.4.x-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        env:
          SKIP_ANDROID: '1'
        run: bash .github/scripts/prebuild.sh
      - name: Record toolchain
        run: swift --version
      - name: Run full test suite
        run: swift test --no-parallel --jobs 4
