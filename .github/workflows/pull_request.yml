name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Test on macOS
    runs-on: xcode-27
    timeout-minutes: 180
    needs: [soundness, space-format-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test SwiftBuild
        run: xcrun swift test --jobs 2
      - name: Build for iOS
        run: |
          xcrun xcodebuild -workspace . -scheme SwiftBuild-Package \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build

  cmake-smoke-test:
    name: CMake smoke test on macOS
    runs-on: xcode-27
    timeout-minutes: 180
    needs: [soundness, space-format-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          cmake --version
          ninja --version
      - name: Build with CMake
        run: |
          xcrun swift package cmake-smoke-test --disable-sandbox \
            --cmake-path "$(command -v cmake)" --ninja-path "$(command -v ninja)" \
            --extra-cmake-arg "-DCMAKE_C_COMPILER=$(xcrun --find clang)" \
            --extra-cmake-arg "-DCMAKE_CXX_COMPILER=$(xcrun --find clang++)" \
            --extra-cmake-arg "-DCMAKE_Swift_COMPILER=$(xcrun --find swiftc)"

  swiftpm-tests:
    name: Test SwiftPM on macOS
    runs-on: xcode-27
    timeout-minutes: 180
    needs: [soundness, space-format-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Prepare SwiftPM dependencies
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: ./.github/scripts/clone-swiftpm-deps.sh "$BASE_BRANCH"
      - name: Test SwiftPM with this SwiftBuild checkout
        env:
          SWIFTCI_USE_LOCAL_DEPS: 1
        run: xcrun swift test --jobs 2 --package-path ../swiftpm --skip testSDKTracking

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@152252f6e4b45fa96d48f1cbefaa351a7389fc2c  # 0.0.14
    with:
      license_header_check_project_name: "Swift"
      api_breakage_check_enabled: false
      format_check_enabled: false

  space-format-check:
    name: Space format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run space format check
        run: cat .github/scripts/format-check.sh | bash

  build-verdicts:
    name: Build Verdicts
    runs-on: ubuntu-latest
    needs:
      - tests
      - cmake-smoke-test
      - swiftpm-tests
      - soundness
      - space-format-check
    if: always()  # Runs even if previous jobs fail so it can evaluate them
    steps:
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coreutils jq
      - name: Check upstream job statuses
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result != "success")) | .[] | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "The following required jobs did not succeed:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "All required jobs passed successfully!"
